plugins { id 'com.android.application' }

android {
    namespace 'com.justsimple.indexalgo'
    compileSdk 35

    defaultConfig {
        applicationId "com.justsimple.hiteshalgo.full"
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName "5.0.0-clean-install"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
